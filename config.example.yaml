# Copy to config.yaml and set credentials via environment variables; never store secrets in this file.
# Loopback-only by default. Public binding requires both allow_public_bind: true and bearer_key_env.
listen: 127.0.0.1:8787
allow_public_bind: false
bearer_key_env: DECORA_BEARER_KEY
usage_policy: compatible  # default; outputs verified known usage, omits unknown breakdowns, tags provenance in usage.decora
# usage_policy: strict    # requires exact target-dialect usage; allows same-dialect passthrough, filters cross-dialect non-OpenAI up front
# Every public alias is served across all four inbound dialects; internal translation needs no client or config toggles.
allow_http_loopback: false  # for local loopback mocks only; never permits arbitrary HTTP upstreams
max_body_bytes: 8388608
max_response_bytes: 8388608
max_images: 32
max_in_flight: 64
attempt_timeout_ms: 30000
request_timeout_ms: 60000
max_attempts: 3  # total upstream calls per request (including the first), not 3 per candidate

backends:
  openai-primary:
    kind: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    # endpoint: https://api.openai.com/v1/decisions  # default official endpoint
    priority: 0  # lower values are tried first
    weight: 1    # weighted sampling without replacement within the same priority tier
    capabilities:
      question_types: [predicate, choice, score]
      images: true
      prompt_cache: true
      safety_identifier: true
      max_questions: 400

# Public model aliases; clients cannot specify arbitrary upstream models or URLs.
models:
  decora-luna: [openai-primary]

# Additional native upstreams you can add under backends/models; text, role messages, JSON, and mixed typed choices work by default.
# Role/JSON/typed-choice adaptation is automatic; real capabilities like images must still be declared.
# Text-encoded role messages preserve labels/order, not native OpenAI role hierarchy or prompt-injection isolation.
# Unknown cached/reasoning tokens are never zero-filled; TypeSafe billable_input and Gemini total_input_tokens are tagged in usage.decora.
# strict mode returns unsupported_usage before making paid calls when exact usage cannot be satisfied.
# Only configure backends you actually use; startup requires every configured backend's credential env var.
