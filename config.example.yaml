# 复制为 config.yaml 后设置环境变量；此文件不含密钥。
# 默认仅本机访问。公网监听需要 allow_public_bind: true 和 bearer_key_env。
listen: 127.0.0.1:8787
allow_public_bind: false
bearer_key_env: DECORA_BEARER_KEY
usage_policy: compatible  # 默认；只输出真实已知 usage，缺失明细省略，usage.decora 标记口径
# usage_policy: strict    # 要求完整精确的 OpenAI usage；提前排除 OpenRouter/Jev
# 所有公开 alias 均接收同一种 OpenAI Decisions 请求；内部转换无需客户端或配置选择。
allow_http_loopback: false  # 只供本机 mock 使用；不是允许任意 HTTP 上游
max_body_bytes: 8388608
max_response_bytes: 8388608
max_images: 32
max_in_flight: 64
attempt_timeout_ms: 30000
request_timeout_ms: 60000
max_attempts: 3  # 整个请求的总调用次数（包括首次），不是每个候选各 3 次

backends:
  openai-primary:
    kind: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    # endpoint: https://api.openai.com/v1/decisions  # 默认官方入口
    priority: 0  # 越小越优先
    weight: 1   # 同优先级按权重无放回排列
    capabilities:
      question_types: [predicate, choice, score]
      images: true
      prompt_cache: true
      safety_identifier: true
      max_questions: 400

# 公开模型 alias，客户端不能用 model 指定任意上游模型或 URL。
models:
  decora-luna: [openai-primary]

# 可在 backends/models 中添加以下原生上游；默认支持文本、角色消息、JSON 和混合 typed choice。
# 角色/JSON/typed choice 自动内部适配，没有格式开关；images 等真实能力仍需声明。
# 角色文本编码保留标签/顺序，不等于原生 OpenAI 指令层级，也不是 prompt injection 隔离。
# 未知缓存/推理 token 不填 0；TypeSafe billable input 与 Gemini total_input_tokens 明确写入 usage.decora。
# strict 模式会提前返回 unsupported_usage；不会为获取缺失明细而付费调用。
# 只配置实际使用的后端；启动时会要求所有已配置后端的凭据环境变量。
