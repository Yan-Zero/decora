[package]
name = "decora"
version = "0.1.0"
edition = "2024"
description = "Multi-dialect Decisions protocol gateway with strict probability and capability contracts"
license = "MIT"

[[bin]]
name = "decora"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:httpdate",
    "dep:rand",
    "dep:reqwest",
    "dep:serde-saphyr",
    "dep:subtle",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "0.22"
http = "1"
httpdate = { version = "1", optional = true }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"], optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
